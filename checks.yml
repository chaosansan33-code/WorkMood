name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify browser JavaScript
        run: node --check docs/app.js
      - name: Verify backend behavior
        run: python3 -m unittest discover -s tests -v
